<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#f6faf7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="DripAdvisor" />
<title>DripAdvisor · Turin</title>
<style>
  :root {
    --ink:#163b39; --ink-2:#4c6a63; --muted:#6b7f78; --forest:#12544b; --leaf:#2d7770;
    --mint:#e4f4ea; --mint-2:#d2eadb; --paper:#ffffff; --bg:#f6faf7; --line:#e3ebe6;
    --amber-bg:#fff4e2; --amber:#8a5a1f; --red:#b3261e; --red-bg:#fdecea;
    --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; padding:0; }
  body { font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Helvetica Neue", sans-serif; color:var(--ink); background:#e6f0ea; -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.4; }
  a { color:inherit; text-decoration:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  .svgdefs { position:absolute; width:0; height:0; overflow:hidden; }
  .ic { width:22px; height:22px; flex:none; stroke:currentColor; stroke-width:1.85; stroke-linecap:round; stroke-linejoin:round; fill:none; vertical-align:middle; }
  .ic-sm{width:18px;height:18px}.ic-xs{width:15px;height:15px}.ic-lg{width:26px;height:26px}

  /* App shell: full screen on iPhone, a phone-width column on larger screens */
  .app { max-width:440px; min-height:100vh; min-height:100dvh; margin:0 auto; background:var(--bg); position:relative; display:flex; flex-direction:column; }
  @media (min-width:600px){ body{padding:24px 0} .app{min-height:calc(100dvh - 48px); border-radius:36px; box-shadow:0 20px 50px rgba(21,51,44,.16); overflow:hidden} }
  main { flex:1; padding:calc(var(--safe-top) + 10px) 18px calc(96px + var(--safe-bottom)); }

  /* Headers */
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 0 16px; }
  .wordmark { display:flex; align-items:center; gap:9px; font-size:24px; font-weight:800; letter-spacing:-1px; }
  .wordmark .dot { color:#7faf8d; }
  .tinybrand { width:32px; height:32px; border-radius:10px; background:var(--forest); color:#fff; display:flex; align-items:center; justify-content:center; }
  .tinybrand .ic { width:19px; height:19px; stroke-width:2.3; }
  .locationpill { display:flex; align-items:center; gap:5px; border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; font-size:14px; font-weight:650; color:var(--ink-2); }
  .navhead { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0 14px; }
  .navhead .left { display:flex; align-items:center; gap:12px; min-width:0; }
  .navhead h1 { font-size:20px; font-weight:780; letter-spacing:-.5px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .roundbtn { width:40px; height:40px; flex:none; border-radius:50%; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:#2e5450; }

  /* Hero */
  .hero { background:radial-gradient(circle at 86% 70%,#4d8e80 0,#2b736a 30%,#165149 55%,#10423e 100%); border-radius:26px; padding:22px 20px; position:relative; overflow:hidden; color:#fff; }
  .hero .eyebrow { color:#ccf4df; text-transform:uppercase; font-weight:800; font-size:11px; letter-spacing:1.4px; display:flex; align-items:center; gap:6px; margin-bottom:12px; position:relative; z-index:2; }
  .hero h2 { font-size:28px; letter-spacing:-1.1px; font-weight:780; line-height:1.1; margin:0 0 8px; position:relative; z-index:2; max-width:220px; }
  .hero p { color:#d9eee8; font-size:14px; line-height:1.45; margin:0; max-width:210px; position:relative; z-index:2; }
  .hero-orbit { position:absolute; right:-62px; bottom:-84px; width:245px; height:245px; border:1px solid #a5e5cd4a; border-radius:50%; box-shadow:0 0 0 30px #b6eed01a,0 0 0 68px #b6eed017; }
  .hero-graphic { position:absolute; top:34px; right:18px; width:96px; height:96px; background:#e3f4e4; border-radius:28px; transform:rotate(14deg); display:flex; align-items:center; justify-content:center; box-shadow:0 13px 22px #07393142; }
  .hero-graphic .ic { width:56px; height:56px; color:#24685e; transform:rotate(-14deg); stroke-width:1.4; }

  /* Search */
  .searchbox { display:flex; align-items:center; gap:10px; height:52px; margin-top:16px; padding:0 14px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 5px 11px #2b604909; color:#5c8177; }
  .searchbox input { flex:1; min-width:0; border:0; outline:0; background:transparent; font:inherit; font-size:16px; color:var(--ink); }
  .searchbox input::placeholder { color:#80928b; }

  /* Sections */
  .secthead { display:flex; justify-content:space-between; align-items:baseline; margin:22px 0 11px; }
  .secthead h2 { font-size:18px; font-weight:780; letter-spacing:-.4px; margin:0; }
  .secthead a, .secthead span { font-size:14px; font-weight:650; color:#2f7a6c; display:flex; align-items:center; gap:2px; }

  .categorygrid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
  .cat { min-height:96px; background:#fff; border:1px solid var(--line); border-radius:18px; padding:13px; display:flex; flex-direction:column; justify-content:space-between; gap:10px; }
  .cat strong { font-size:15px; font-weight:700; letter-spacing:-.2px; color:#2f4944; line-height:1.2; }
  .cat small { display:block; font-size:12px; color:var(--muted); font-weight:500; margin-top:2px; }
  .tone { width:36px; height:36px; border-radius:11px; display:flex; align-items:center; justify-content:center; flex:none; }
  .tone.a{background:#e4f5e9;color:#2f7d66}.tone.b{background:#efeeff;color:#6656ad}.tone.c{background:#fff1dc;color:#94692a}.tone.d{background:#e6f3fb;color:#2f6f94}.tone.r{background:var(--red-bg);color:var(--red)}

  /* ED summary card */
  .edcard { display:block; background:#fff; border:1px solid var(--line); border-radius:20px; padding:16px; }
  .edcard .row { display:flex; align-items:center; gap:12px; }
  .edcard .big { font-size:30px; font-weight:800; letter-spacing:-1px; line-height:1; }
  .edcard .lbl { font-size:14px; color:var(--ink-2); line-height:1.3; }
  .live { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:#2f7a6c; }
  .live::before { content:""; width:8px; height:8px; border-radius:50%; background:#2fa36f; box-shadow:0 0 0 3px #2fa36f2e; }
  .live.stale { color:var(--amber); } .live.stale::before { background:#d39b3a; box-shadow:0 0 0 3px #d39b3a2e; }
  .minirow { display:flex; gap:8px; margin-top:14px; overflow:hidden; }
  .mini { flex:1; min-width:0; background:var(--bg); border-radius:12px; padding:9px 10px; }
  .mini b { display:block; font-size:16px; } .mini span { display:block; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* Lists */
  .listcard { display:block; background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; margin-bottom:10px; }
  .list-header { display:flex; align-items:center; gap:12px; }
  .storetitle { flex:1; min-width:0; }
  .storetitle strong { display:block; font-size:16px; font-weight:750; letter-spacing:-.3px; line-height:1.25; }
  .storetitle small { display:block; font-size:13px; color:var(--muted); margin-top:3px; }
  .addr { font-size:14px; color:var(--ink-2); margin:10px 0 0; display:flex; gap:6px; align-items:flex-start; }
  .addr .ic { color:#5c8177; margin-top:1px; }
  .storefoot { display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid #edf1ef; margin-top:12px; padding-top:11px; flex-wrap:wrap; }
  .rating { font-size:14px; font-weight:700; display:flex; align-items:center; gap:4px; }
  .rating .ic { color:#c48a1d; fill:#e9b54a; stroke:#c48a1d; }
  .rating small { font-weight:500; color:var(--muted); font-size:12px; }
  .tag { background:#edf7f0; color:#256d5f; font-size:12px; font-weight:700; padding:6px 10px; border-radius:999px; white-space:nowrap; }
  .tag.amber { background:var(--amber-bg); color:var(--amber); }
  .tag.red { background:var(--red-bg); color:var(--red); }
  .chev { color:#83a296; }

  .hint { display:flex; gap:10px; align-items:flex-start; background:#eaf5ee; border-radius:16px; padding:13px; color:#3f6158; margin:4px 0 12px; }
  .hint .ic { color:#3a7f6e; margin-top:1px; }
  .hint p { margin:0; font-size:14px; line-height:1.45; }
  .hint.amber { background:var(--amber-bg); color:#6d4c1f; } .hint.amber .ic { color:var(--amber); }
  .hint.red { background:var(--red-bg); color:#7b1d17; } .hint.red .ic { color:var(--red); }
  .hint a.inline { font-weight:750; text-decoration:underline; }

  .chips { display:flex; gap:8px; margin:0 0 14px; overflow-x:auto; scrollbar-width:none; }
  .chip { padding:9px 14px; background:#fff; border:1px solid var(--line); border-radius:12px; font-size:14px; font-weight:650; color:#4f6a63; white-space:nowrap; }
  .chip.active { background:var(--forest); border-color:var(--forest); color:#fff; }

  /* ED list */
  .emergency { display:flex; align-items:center; gap:12px; background:var(--red); color:#fff; border-radius:18px; padding:14px 16px; margin-bottom:12px; }
  .emergency strong { display:block; font-size:16px; } .emergency span { font-size:13px; opacity:.9; }
  .emergency .num112 { margin-left:auto; background:#fff; color:var(--red); font-weight:800; border-radius:12px; padding:8px 12px; font-size:16px; }
  .edrow .counts { display:flex; align-items:baseline; gap:6px; margin-left:auto; text-align:right; flex:none; }
  .edrow .counts b { font-size:24px; font-weight:800; letter-spacing:-.6px; }
  .edrow .counts span { font-size:12px; color:var(--muted); line-height:1.1; }
  .triagebar { display:flex; height:8px; border-radius:6px; overflow:hidden; background:#eef2ef; margin-top:12px; gap:2px; }
  .triagebar i { display:block; height:100%; }
  .t-rosso{background:#d0342c}.t-arancione{background:#ef8a2c}.t-azzurro{background:#45a3d9}.t-verde{background:#3ea66b}.t-bianco{background:#c9d2ce}
  .note-sub { font-size:12px; color:var(--muted); margin-top:8px; }

  /* Detail */
  .profile-cover { height:132px; border-radius:22px; background:radial-gradient(circle at 80% 20%,#bedfd0 0%,#e1eee4 44%,#dceadf 100%); position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .cover-ring { width:230px; height:230px; border:1px solid #9bcfba; border-radius:50%; position:absolute; right:-70px; top:-106px; box-shadow:0 0 0 33px #d1e9dc66,0 0 0 66px #d1e9dc33; }
  .coverbadge { width:92px; height:92px; background:#f7fff8e0; border:1px solid #ecfff4; border-radius:28px; transform:rotate(-9deg); display:flex; align-items:center; justify-content:center; box-shadow:0 12px 30px #5186711b; }
  .coverbadge .ic { width:58px; height:58px; color:#3e8675; stroke-width:1.35; transform:rotate(9deg); }
  .profile-name h2 { font-size:25px; font-weight:820; letter-spacing:-.8px; margin:16px 0 4px; line-height:1.15; }
  .profile-name p { margin:0 0 10px; color:var(--muted); font-size:14px; }
  .meta-row { display:flex; gap:8px; flex-wrap:wrap; }
  .pillmeta { display:inline-flex; align-items:center; gap:5px; border-radius:8px; padding:6px 9px; font-size:13px; font-weight:650; background:#ecf6f0; color:#2f6e5e; }
  .pillmeta.gray { background:#f0f3f1; color:#5d716a; } .pillmeta.amber { background:var(--amber-bg); color:var(--amber); }
  .block { background:#fff; border:1px solid var(--line); border-radius:18px; padding:14px; margin-top:12px; }
  .block h3 { font-size:16px; font-weight:780; margin:0 0 6px; letter-spacing:-.2px; }
  .kv { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #eef2ef; font-size:15px; }
  .kv:last-child { border-bottom:0; padding-bottom:2px; }
  .kv span { color:var(--ink-2); } .kv strong { font-weight:700; text-align:right; }
  .kv strong.amber { color:var(--amber); } .kv strong.green { color:#256d5f; }
  .empty { text-align:center; padding:12px 6px 6px; color:var(--ink-2); font-size:14px; }
  .empty .ic { width:30px; height:30px; color:#8db3a6; margin-bottom:6px; }
  .empty strong { display:block; color:var(--ink); font-size:15px; margin-bottom:3px; }
  .access-box { display:flex; gap:11px; background:#edf6ef; border-radius:16px; padding:14px; margin-top:12px; }
  .access-box .ic { color:#3a7f6e; } .access-box strong { font-size:15px; } .access-box p { font-size:14px; line-height:1.45; color:#4d685f; margin:4px 0 0; }
  .ctas { display:flex; gap:10px; margin-top:16px; }
  .btn { border-radius:15px; padding:15px 14px; font-size:16px; font-weight:750; display:flex; align-items:center; justify-content:center; gap:8px; }
  .btn.primary { background:var(--forest); color:#fff; flex:1; }
  .btn.secondary { background:#fff; border:1px solid #d5e3da; color:#245f52; flex:1; }
  .source { font-size:12px; color:#7f918a; text-align:center; margin:16px 8px 0; line-height:1.5; }
  .source a { text-decoration:underline; }
  .prose p { font-size:15px; line-height:1.55; color:var(--ink-2); margin:0 0 12px; }
  .prose h3 { font-size:16px; margin:18px 0 6px; }
  .prose a { text-decoration:underline; color:#1f6a5c; }

  /* Tab bar */
  .tabbar { position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:440px; background:rgba(255,255,255,.94); backdrop-filter:saturate(180%) blur(18px); -webkit-backdrop-filter:saturate(180%) blur(18px); border-top:1px solid #e8eeea; display:flex; justify-content:space-around; padding:8px 8px calc(8px + var(--safe-bottom)); z-index:20; }
  @media (min-width:600px){ .tabbar{ bottom:24px; border-radius:0 0 36px 36px; padding-bottom:16px } }
  .tab { display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px; font-weight:650; color:#8ba198; min-width:64px; }
  .tab.selected { color:#1f6a5c; }
  .tab .ic { width:24px; height:24px; }
  .skeleton { color:var(--muted); font-size:14px; padding:6px 0; }
</style>
</head>

<script>
const APP_NAME = "DripAdvisor";
const ED_API = "https://api.prontosoccorso.live/api/piemonte/torino";
const ED_PAGE = "https://prontosoccorso.live/piemonte/torino";

// Piedmont triage colours, most to least urgent
const TRIAGE = [
  { key: "rosso", label: "Red", meaning: "Emergency" },
  { key: "arancione", label: "Orange", meaning: "Urgent" },
  { key: "azzurro", label: "Light blue", meaning: "Deferrable urgency" },
  { key: "verde", label: "Green", meaning: "Minor urgency" },
  { key: "bianco", label: "White", meaning: "Non-urgent" }
];

// Friendlier names and specialties for feed entries (the feed's own names are long)
const ED_NAMES = {
  sanLuigiGonzaga: { name: "San Luigi Gonzaga", city: "Orbassano" },
  molinette: { name: "Molinette", city: "Torino" },
  cto: { name: "CTO", city: "Torino", note: "Trauma & orthopaedics", specialist: true },
  st_anna: { name: "Sant'Anna", city: "Torino", note: "Obstetrics & gynaecology", specialist: true },
  regina_margherita: { name: "Regina Margherita", city: "Torino", note: "Children's hospital", specialist: true },
  mauriziano: { name: "Mauriziano", city: "Torino" },
  maria_vittoria: { name: "Maria Vittoria", city: "Torino" },
  martini: { name: "Martini", city: "Torino" },
  oftalmico: { name: "Oftalmico", city: "Torino", note: "Eye emergencies", specialist: true },
  san_giovanni_bosco: { name: "San Giovanni Bosco", city: "Torino" },
  chieri: { name: "Ospedale Maggiore", city: "Chieri" },
  moncalieri: { name: "Santa Croce", city: "Moncalieri" },
  carmagnola: { name: "San Lorenzo", city: "Carmagnola" }
};

const CATS = window.DA_CATEGORIES;
const PROVIDERS = window.DA_PROVIDERS;
const ed = { list: null, fetchedAt: null, live: false, loading: false, lastTry: 0 };
let edSort = "waiting";

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const icon = (id, cls = "") => `<svg class="ic ${cls}"><use href="#i-${id}"/></svg>`;
const tel = p => "tel:" + String(p).replace(/[^\d+]/g, "");
const fmtTime = d => d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
const fmtDate = d => d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ", " + fmtTime(d);
const when = d => d.toDateString() === new Date().toDateString() ? fmtTime(d) : fmtDate(d);
const catById = id => CATS.find(c => c.id === id);

function mapsUrl(p) {
  const q = encodeURIComponent(`${p.name}, ${p.address}`);
  return p.placeId
    ? `https://www.google.com/maps/search/?api=1&query=${q}&query_place_id=${p.placeId}`
    : `https://www.google.com/maps/search/?api=1&query=${q}`;
}

/* ---------- Emergency-department data ---------- */

function normaliseEd(raw, updatedAt) {
  return raw.map(h => {
    const d = h.data && h.data.data;
    const names = ED_NAMES[h.key] || { name: h.nome, city: "" };
    const levels = TRIAGE.map(t => ({
      ...t,
      waiting: d ? Number(d[t.key]?.extra?.in_attesa?.value ?? d[t.key]?.value ?? 0) : 0,
      treating: d ? Number(d[t.key]?.extra?.in_trattamento?.value ?? 0) : 0
    }));
    return {
      key: h.key, ...names,
      fullName: h.descrizione || h.nome,
      address: (h.indirizzo || "").trim(),
      phone: (h.telefono || "").trim(),
      web: h.web,
      hasData: !!d,
      updatedAt,
      levels,
      waiting: levels.reduce((s, l) => s + l.waiting, 0),
      treating: levels.reduce((s, l) => s + l.treating, 0)
    };
  });
}

async function loadEd(force = false) {
  if (ed.loading) return;
  if (!force && ed.live && Date.now() - ed.lastTry < 60000) return;
  ed.loading = true; ed.lastTry = Date.now();
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(ED_API, { signal: ctrl.signal, cache: "no-store" });
    clearTimeout(t);
    const json = await res.json();
    if (!json.status || !Array.isArray(json.data)) throw new Error("Unexpected response");
    // The feed sometimes answers without counts while it refreshes; keep the last good data instead
    const now = new Date();
    const fresh = normaliseEd(json.data, now);
    if (!fresh.some(h => h.hasData)) throw new Error("Feed returned no counts");
    // Hospitals missing from this update keep their last known counts, labelled with their own time
    ed.list = fresh.map(f => {
      if (f.hasData) return f;
      const prev = ed.list && ed.list.find(p => p.key === f.key && p.hasData);
      return prev ? { ...prev, stale: true } : f;
    });
    ed.fetchedAt = now; ed.live = true;
  } catch (e) {
    ed.live = false;
    setTimeout(() => loadEd(true), 10000);
  }
  ed.loading = false;
  render();
}

function edStatus() {
  if (!ed.list) return `<span class="live stale">Loading…</span>`;
  return ed.live
    ? `<span class="live">Live · updated ${fmtTime(ed.fetchedAt)}</span>`
    : `<span class="live stale">Not live · last update ${fmtDate(ed.fetchedAt)}</span>`;
}

function triageBar(h) {
  if (!h.waiting) return `<div class="triagebar"></div>`;
  return `<div class="triagebar" aria-hidden="true">${h.levels.filter(l => l.waiting).map(l =>
    `<i class="t-${l.key}" style="flex:${l.waiting}"></i>`).join("")}</div>`;
}

/* ---------- Shared pieces ---------- */

function navHead(title, back = "#/") {
  return `<header class="navhead"><div class="left"><a class="roundbtn" href="${back}" aria-label="Back">${icon("left", "ic-sm")}</a><h1>${esc(title)}</h1></div></header>`;
}

function ratingHtml(p) {
  if (!p.rating) return `<span class="rating"><small>No Google rating stored</small></span>`;
  return `<span class="rating">${icon("star", "ic-xs")}${p.rating.toFixed(1)} <small>(${p.reviews}) Google</small></span>`;
}

function providerCard(p) {
  const c = catById(p.category);
  const edH = p.edKey && ed.list && ed.list.find(h => h.key === p.edKey);
  const right = edH ? `<span class="tag">${edH.waiting} waiting in ED</span>`
    : p.hoursNote ? `<span class="tag">Night service</span>`
    : `<span class="tag amber">Prices not yet known</span>`;
  return `<a class="listcard" href="#/p/${p.id}">
    <div class="list-header"><span class="tone ${c.tone}">${icon(c.icon)}</span>
      <div class="storetitle"><strong>${esc(p.name)}</strong><small>${esc(p.type)}</small></div>${icon("right", "ic-sm chev")}</div>
    <div class="addr">${icon("pin", "ic-xs")}${esc(p.address)}</div>
    <div class="storefoot">${p.ssn === "public" ? `<span class="rating" style="font-weight:650;color:#256d5f">${icon("shield", "ic-xs")} SSN public hospital</span>` : ratingHtml(p)}${right}</div>
  </a>`;
}

function tabbar(active) {
  const tabs = [["explore", "#/", "home", "Explore"], ["search", "#/search", "search", "Search"], ["er", "#/er", "pulse", "ER live"], ["about", "#/about", "info", "About"]];
  document.getElementById("tabbar").innerHTML = tabs.map(([id, href, ic, label]) =>
    `<a class="tab ${active === id ? "selected" : ""}" href="${href}">${icon(ic)}${label}</a>`).join("");
}

const edRow = h => `<a class="listcard edrow" href="#/er/${h.key}">

  const list = ed.list ? [...ed.list].sort(edSort === "waiting"

  return `<header class="navhead"><div class="left"><h1 style="font-size:26px">Emergency care</h1></div>

      <div class="meta-row">${h.note ? `<span class="pillmeta">${esc(h.note)}</span>` : ""}<span class="pillmeta">${icon("shield", "ic-xs")} Public SSN</span></div></div>
    <div class="block"><div style="display:flex;justify-content:space-between;align-items:center"><h3>${h.stale ? "Last known" : "Right now"}</h3>${h.stale ? `<span class="live stale">As of ${when(h.updatedAt)}</span>` : edStatus()}</div>
      <div class="kv"><span>Waiting to be seen</span><strong>${h.waiting}</strong></div>

      ${h.levels.map(l => `<div class="kv"><span style="display:flex;align-items:center;gap:8px"><i class="t-${l.key}" style="width:12px;height:12px;border-radius:4px;display:inline-block"></i>${l.label} · ${l.meaning}</span><strong>${l.waiting} <span style="font-weight:500;color:var(--muted);font-size:13px">/ ${l.treating} in care</span></strong></div>`).join("")}

    <div class="ctas"><a class="btn secondary" href="${tel(h.phone)}">${icon("phone", "ic-sm")} Call</a>
      <a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">${icon("map", "ic-sm")} Google Maps</a></div>
    <p class="source">${esc(h.address)}<br>Data from <a href="${ED_PAGE}" target="_blank" rel="noopener">prontosoccorso.live</a>. In an emergency call <a href="tel:112">112</a>.</p>`;

const KEYWORDS = {
  equipment: ["crutch", "stampell", "walker", "wheelchair", "brace", "ortoped", "orthop", "equipment", "aid", "sanitari"],
  doctors: ["dent", "tooth", "teeth", "doctor", "medic", "clinic", "poliamb", "specialist", "visit"],
  pharmacies: ["pharma", "farmac", "medicine", "drug", "chemist", "prescription"],
  hospitals: ["hospital", "ospedal", "emergency", "pronto", "soccorso", "a&e"]
};

function searchResults(q) {
  const s = q.trim().toLowerCase();
  if (!s) return "";
  const cats = Object.keys(KEYWORDS).filter(k => KEYWORDS[k].some(w => s.includes(w) || (s.length > 2 && w.startsWith(s))));
  const hits = PROVIDERS.filter(p => cats.includes(p.category) ||
    [p.name, p.type, p.address, catById(p.category).label].join(" ").toLowerCase().includes(s));
  const edHits = (ed.list || []).filter(h => [h.name, h.fullName, h.city, h.note].join(" ").toLowerCase().includes(s));
  if (!hits.length && !edHits.length) return `<div class="block"><div class="empty">${icon("search")}<strong>Nothing for “${esc(q)}” yet</strong>This first version covers 12 places in Turin. Try “dentist”, “crutches” or “pharmacy”.</div></div>`;
  return `${hits.map(providerCard).join("")}
    ${edHits.map(h => `<a class="listcard" href="#/er/${h.key}"><div class="list-header"><span class="tone r">${icon("pulse")}</span><div class="storetitle"><strong>Pronto Soccorso ${esc(h.name)}</strong><small>${esc(h.city)} · ${h.waiting} waiting</small></div>${icon("right", "ic-sm chev")}</div></a>`).join("")}`;
}

let lastQuery = "";

  return `<header class="navhead"><div class="left"><h1 style="font-size:26px">Search</h1></div></header>
    <label class="searchbox" style="margin-top:0">${icon("search")}<input id="q" type="search" placeholder="Crutches, dentist, pharmacy…" value="${esc(lastQuery)}" autocomplete="off" enterkeyhint="search" /></label>
    <div class="chips" style="margin-top:12px">${["Crutches", "Dentist", "Pharmacy", "Emergency"].map(t => `<button class="chip" data-q="${t}">${t}</button>`).join("")}</div>
    <div id="results">${searchResults(lastQuery)}</div>`;
}

function screenAbout() {
  return `<header class="navhead"><div class="left"><h1 style="font-size:26px">About this version</h1></div></header>
    <div class="prose">
      <p><strong>${APP_NAME} v1</strong> is an early test version for Turin. It includes 12 real places (3 per category) and live emergency-department counts.</p>

function screenNotFound() {
  return `${navHead("Not found")}<div class="block"><div class="empty">${icon("info")}<strong>That page doesn't exist</strong><a href="#/" style="text-decoration:underline">Back to Explore</a></div></div>`;
}

/* ---------- Router ---------- */

function render() {
  const parts = (location.hash.replace(/^#\/?/, "") || "").split("/");
  const view = document.getElementById("view");
  let html, tab = "explore";
  switch (parts[0]) {
    case "": html = screenExplore(); break;
    case "c": html = screenCategory(parts[1]); break;
    case "p": html = screenProvider(parts[1]); break;
    case "er": html = parts[1] ? screenErDetail(parts[1]) : screenEr(); tab = "er"; break;
    case "search": html = screenSearch(); tab = "search"; break;
    case "about": html = screenAbout(); tab = "about"; break;
    default: html = screenNotFound();
  }
  // Re-rendering the search screen would steal focus from the input, so only update its results
  if (parts[0] === "search" && document.getElementById("q")) {
    document.getElementById("results").innerHTML = searchResults(lastQuery);
  } else {
    view.innerHTML = html;
  }
  tabbar(tab);
  if (parts[0] === "search") bindSearch();
}

function bindSearch() {
  const q = document.getElementById("q");
  if (q.dataset.bound) return;
  q.dataset.bound = "1";
  q.addEventListener("input", () => { lastQuery = q.value; document.getElementById("results").innerHTML = searchResults(lastQuery); });
  document.querySelectorAll("[data-q]").forEach(b => b.addEventListener("click", () => { q.value = lastQuery = b.dataset.q; q.dispatchEvent(new Event("input")); }));
}

window.addEventListener("hashchange", () => { document.getElementById("view").innerHTML = ""; render(); window.scrollTo(0, 0); if (location.hash.startsWith("#/er")) loadEd(); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadEd(); });
setInterval(() => { if (!document.hidden) loadEd(true); }, 60000);
// Show the dated snapshot straight away (labelled "Not live"); the live request replaces it
if (window.DA_ED_SNAPSHOT) {
  ed.fetchedAt = new Date(window.DA_ED_SNAPSHOT.fetchedAt);
  ed.list = normaliseEd(window.DA_ED_SNAPSHOT.data, ed.fetchedAt);
}
render();
loadEd(true);
</script>
